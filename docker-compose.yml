# NUR Project — Docker Compose (development)
# Ishga tushirish: docker compose up -d
# To'xtatish:      docker compose down
# Hammasini o'chirish (DB ham): docker compose down -v

# Qat'iy project nomi — volume nomi (nur-erp_postgres_data) qaysi papka/yo'ldan
# ishga tushirilsa ham o'zgarmaydi, shuning uchun baza hech qachon "adashib" yo'qolmaydi.
name: nur-erp

services:
  postgres:
    image: postgres:16-alpine
    container_name: nur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nur_erp
      # Dev uchun — docker tarmog'i ichida parol talab qilinmaydi.
      # Prod'da bu qatorni olib tashlang va parolni .env orqali bering.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Host 5434 -> container 5432. 5432/5433 boshqa projectlar tomonidan band
      # qilingani uchun ziddiyatdan qochamiz. Backend baribir ichki tarmoq orqali
      # 'postgres:5432'ga ulanadi — bu o'zgarish faqat hostdan ulanishga taalluqli.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nur_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nur-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nur_erp
      SECRET_KEY: dev-secret-change-me-in-production
      DEBUG: "true"
      # Frontend host porti 5174 (5173 boshqa loyiha tomonidan band) — CORS ro'yxati
      # port bilan mos bo'lishi SHART, aks holda brauzer preflight (OPTIONS) 400 oladi
      # va login so'rovi umuman ketmaydi. Ikkalasi ham qoldirildi.
      ALLOWED_ORIGINS_STR: "http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173,http://127.0.0.1:5173"
      INIT_ADMIN_PHONE: "+998901234567"
      INIT_ADMIN_PASSWORD: Admin@12345
      INIT_ADMIN_NAME: Super Admin
      # NUR Agent (Instagram) lead ingest kaliti — tashqi agent shu bilan yozadi.
      AGENT_INGEST_KEY: ${AGENT_INGEST_KEY:-dev-agent-key-change-me}
    ports:
      # Host 8011 -> container 8000. 8000/8001/8002 boshqa projectlar yoki Windows
      # tomonidan band bo'lgani uchun tashqi port 8011 ga ko'chirildi.
      - "8011:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo '[init] Starting uvicorn...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Telegram kanal → WhatsApp ko'prigi: kanaldagi postni belgilangan vaqtdan
  # keyin xodimning WhatsApp raqamiga yuboradi (u forward qilib kanalga qo'yadi).
  # Sozlamalar «Tizim sozlamalari → Telegram → WhatsApp» da; o'chiq bo'lsa
  # jarayon shunchaki kutib turadi.
  wa-bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nur-wa-bridge
    profiles: ["bot"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nur_erp
      SECRET_KEY: dev-secret-change-me-in-production
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.integrations.wa_bridge"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nur-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8011/api/v1
    ports:
      # Host 5174 -> container 5173. 5173 boshqa loyiha (zinnur) tomonidan band
      # qilingani uchun ziddiyatdan qochamiz — postgres (5434) va backend (8011)
      # bilan bir xil yondashuv. Lokal sayt: http://localhost:5174
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # NUR Agent (Instagram AI sotuv agenti) — ERP'dan ALOHIDA image.
  # Odatiy `up` da ishga tushmaydi; faqat profil bilan:
  #   docker compose --profile agent up -d agent agent-redis
  # Avval agent/.env ni to'ldiring (cp agent/.env.example agent/.env).
  # Webhook lokal test: ngrok http 8020  -> Meta webhook URL.
  agent:
    profiles: ["agent"]
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: nur-agent
    restart: unless-stopped
    env_file: ./agent/.env
    environment:
      # ERP ichki tarmoq orqali (compose ichida backend:8000)
      ERP_INGEST_URL: http://backend:8000/api/v1/leads/ingest
      AGENT_INGEST_KEY: ${AGENT_INGEST_KEY:-dev-agent-key-change-me}
      REDIS_URL: redis://agent-redis:6379/0
    ports:
      - "8020:8000"
    volumes:
      - ./agent:/app
    depends_on:
      - backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  agent-redis:
    profiles: ["agent"]
    image: redis:7-alpine
    container_name: nur-agent-redis
    restart: unless-stopped

  # Telegram bot (dev) — odatiy `up` da ishga tushmaydi; faqat profil bilan:
  #   docker compose --profile bot up -d telegram-bot
  # TELEGRAM_BOT_TOKEN ni o'rnatib qo'ying (env yoki .env).
  telegram-bot:
    profiles: ["bot"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nur-telegram-bot
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nur_erp
      SECRET_KEY: dev-secret-change-me-in-production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_IDS: ${TELEGRAM_ADMIN_CHAT_IDS:-}
      TELEGRAM_REPORT_TIME: ${TELEGRAM_REPORT_TIME:-20:00}
      TIMEZONE: ${TIMEZONE:-Asia/Tashkent}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.integrations.telegram"]

volumes:
  postgres_data:
    # Volume nomini ANIQ belgilaymiz: eski 'nurproject' loyihasida yaratilgan va
    # sizning bazangiz turgan volume'ni qayta ishlatamiz. Endi project nomi yoki
    # papka o'zgarsa ham shu volume (va undagi baza) doimo ishlatiladi — ma'lumot
    # boshqa "adashgan" volume'da qolib ketmaydi.
    name: nurproject_postgres_data
