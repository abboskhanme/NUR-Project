# Ikkinchi brend frontend nginx'i (docker-compose.brand2.yml mount qiladi).
#
# NUR'nikidan (nginx.conf) farqi: /api va /health ni O'ZINING backendiga
# o'tkazadi. Sababi: Caddy faqat shu konteynerga ulanadi, brand2 backendi esa
# NUR tarmog'iga umuman qo'shilmaydi — u NUR'ning postgres/agent/backend
# konteynerlarini nomidan ham ko'ra olmaydi.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker ichki DNS — backend qayta yaratilsa yangi IP olinadi
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://brand2-backend:8000;

    client_max_body_size 25m;   # backend MAX_UPLOAD_SIZE_MB=20

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass $backend;
    }

    # Statik fayllarni keshlash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html hech qachon keshlanmasin (yangi build darhol ko'rinsin)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # React Router — har qanday yo'l index.html ga tushadi
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
